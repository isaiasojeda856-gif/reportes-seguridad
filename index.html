<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Novedad - Seguridad</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        .warning-text {
            font-size: 0.75rem;
            color: #d97706;
            margin-top: 4px;
            display: block;
        }

        .conditional-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            margin-top: 10px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }

        .btn-success {
            background-color: #16a34a;
            color: white;
            display: none;
        }

        .btn-success:hover {
            background-color: #15803d;
        }

        #preview-container {
            margin-top: 20px;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>INFORME DE NOVEDAD</h2>
    
    <!-- Ubicacion -->
    <div class="row">
        <div class="form-group">
            <label for="manzana">Manzana</label>
            <input type="number" id="manzana" placeholder="Ej: 87" required>
        </div>
        <div class="form-group">
            <label for="lote">Lote</label>
            <input type="number" id="lote" placeholder="Ej: 12" required>
        </div>
    </div>

    <!-- Tipo de Incidencia -->
    <div class="form-group">
        <label for="tipo">Tipo de Incidencia</label>
        <input type="text" id="tipo" placeholder="Ej: Veh&iacute;culo sospechoso / Animal suelto">
    </div>

    <!-- Detalle Borrador -->
    <div class="form-group">
        <label for="detalle">Detalle o Nota R&aacute;pida</label>
        <textarea id="detalle" rows="3" placeholder="Describa brevemente lo sucedido..."></textarea>
    </div>

    <!-- Selector Condicional de Personas -->
    <div class="form-group">
        <label for="personas-check">&iquest;Hubo personas involucradas / identificadas?</label>
        <span class="warning-text">&#9888;&#65039; Al seleccionar "S&iacute;", se habilitar&aacute;n los campos obligatorios de identificaci&oacute;n.</span>
        <select id="personas-check" onchange="togglePersonas()">
            <option value="no">No / No aplica</option>
            <option value="si">S&iacute;, identificadas</option>
        </select>
    </div>

    <!-- Campos Condicionales de Personas -->
    <div id="seccion-personas" class="conditional-box">
        <div class="form-group">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" placeholder="Ej: Sergio Ram&iacute;rez">
        </div>
        <div class="form-group">
            <label for="dni">D.N.I. (N&uacute;mero de Documento)</label>
            <input type="text" id="dni" placeholder="Ej: 12345678" oninput="formatearDNI(this)">
        </div>
        <div class="form-group">
            <label for="domicilio">Domicilio / Residencia</label>
            <input type="text" id="domicilio" placeholder="Ej: Manzana 87, Lote 20 (o S/D)">
        </div>
        <div class="form-group">
            <label for="motivo">Motivo del abordaje</label>
            <input type="text" id="motivo" placeholder="Ej: Instaladores de c&aacute;maras extraviados">
        </div>
    </div>

    <!-- Estado Manual -->
    <div class="form-group">
        <label for="estado">Estado / Conclusi&oacute;n final</label>
        <input type="text" id="estado" placeholder="Ej: Sin novedades / Se acompa&ntilde;a al sector">
    </div>

    <!-- Botones de Accion -->
    <button class="btn-primary" onclick="generarReporte()">Generar Vista Previa</button>
    
    <div id="preview-container"></div>

    <button id="btn-enviar" class="btn-success" onclick="enviarWhatsApp()">Enviar a WhatsApp / Copiar</button>
</div>

<script>
    function togglePersonas() {
        const selector = document.getElementById('personas-check').value;
        const seccion = document.getElementById('seccion-personas');
        if (selector === 'si') {
            seccion.style.display = 'block';
        } else {
            seccion.style.display = 'none';
        }
    }

    function formatearDNI(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length > 8) valor = valor.slice(0, 8);
        if (valor.length > 5) {
            valor = valor.replace(/^(\d{2})(\d{3})(\d{0,3})$/, '$1.$2.$3');
        } else if (valor.length > 2) {
            valor = valor.replace(/^(\d{2})(\d{0,3})$/, '$1.$2');
        }
        input.value = valor;
    }

    let textoFinalGenerado = "";

    function generarReporte() {
        const manzana = document.getElementById('manzana').value.trim();
        const lote = document.getElementById('lote').value.trim();
        const tipo = document.getElementById('tipo').value.trim();
        const detalle = document.getElementById('detalle').value.trim();
        const hayPersonas = document.getElementById('personas-check').value;
        const estado = document.getElementById('estado').value.trim();

        if (!manzana || !lote) {
            alert("Por favor, complete obligatoriamente la Manzana y el Lote.");
            return;
        }

        if (!estado) {
            alert("Por favor, ingrese el Estado o Conclusi\u00f3n final de la operaci\u00f3n.");
            return;
        }

        let fechaHora = new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });

        let cuerpoPersonas = "";
        if (hayPersonas === 'si') {
            const nombre = document.getElementById('nombre').value.trim() || "No consignado";
            const dni = document.getElementById('dni').value.trim() || "No consignado";
            const domicilio = document.getElementById('domicilio').value.trim() || "No consignado";
            const motivo = document.getElementById('motivo').value.trim() || "No consignado";

            cuerpoPersonas = `\nSe efect\u00faa control filiatorio del involucrado:\n- Nombre y Apellido: ${nombre}\n- DNI: ${dni}\n- Domicilio: ${domicilio}\n- Motivo del abordaje: ${motivo}\n`;
        }

        textoFinalGenerado = `*INFORME DE NOVEDAD*\n` +
            `\ud83d\udcc5 *Fecha y Hora:* ${fechaHora}\n` +
            `\ud83d\udccd *Ubicaci\u00f3n:* Manzana ${manzana}, Lote ${lote}\n` +
            `\ud83d\udccc *Clasificaci\u00f3n:* ${tipo || "Novedad general"}\n\n` +
            `\ud83d\udcdd *Descripci\u00f3n Operativa:* ${detalle || "Sin observaciones adicionales."}` +
            cuerpoPersonas + `\n` +
            `\u2705 *Estado:* ${estado}`;

        const preview = document.getElementById('preview-container');
        preview.style.display = 'block';
        preview.textContent = textoFinalGenerado;

        document.getElementById('btn-enviar').style.display = 'block';
    }

    function enviarWhatsApp() {
        if (!textoFinalGenerado) return;

        const urlWp = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoFinalGenerado)}`;
        
        navigator.clipboard.writeText(textoFinalGenerado).then(() => {
            alert("\u00a1Reporte copiado al portapapeles y listo para enviar!");
        }).catch(err => {
            console.error('Error al copiar: ', err);
        });

        window.open(urlWp, '_blank');
    }
</script>

</body>
</html>
